# ─────────────────────────────────────────────────────────
# CVIS v9 — docker-compose.override.yml
# Development overrides.  Activated automatically when you
# run `docker compose up` (Docker Compose merges this file).
#
# DO NOT commit secrets or use this in production.
# ─────────────────────────────────────────────────────────

services:

  backend:
    # Override CMD to single uvicorn worker without hot reload
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --log-level info
    environment:
      - "ENV=${ENV:?Set ENV explicitly to dev or production}"
      - LOG_LEVEL=info
      - GUNICORN_WORKERS=1
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - JWT_SECRET=${JWT_SECRET}
      - "ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-http://localhost:8020,http://127.0.0.1:8020,http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://127.0.0.1}"
    # Mount backend source without masking the frontend bundle baked into
    # the image.
    volumes:
      - ./backend:/app/backend
    # Remove healthcheck delay for faster iteration
    healthcheck:
      start_period: 5s
      interval: 10s

  frontend:
    ports:
      - "${CVIS_HTTP_PORT:-80}:80"
      - "4430:443"      # self-signed HTTPS on 4430 (cert auto-generated)
    environment:
      - DOMAIN=localhost
    # No Let's Encrypt in dev
    healthcheck:
      start_period: 5s

  redis:
    # No password in dev
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru

  # No Prometheus/Grafana in dev by default — uncomment to enable
  prometheus:
    profiles: ["monitoring"]    # only starts with: docker compose --profile monitoring up

  grafana:
    profiles: ["monitoring"]

  # Certbot not needed in dev
  certbot:
    profiles: ["tls"]
