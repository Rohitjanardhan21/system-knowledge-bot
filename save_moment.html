<!-- ═══════════════════════════════════════════════════════
     CVIS — The Save Moment
     Shows when a real failure was prevented.
     No fake data — only fires on real resolved predictions.
     Inject before </body> in frontend/index.html
     ═══════════════════════════════════════════════════════ -->
<style>
/* ── Save moment overlay ── */
#save-moment{display:none;position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:20px}
#save-moment.open{display:flex}
#save-box{background:var(--surface);border:1px solid rgba(52,211,153,.3);border-radius:16px;max-width:580px;width:100%;overflow:hidden;box-shadow:0 0 80px rgba(52,211,153,.08)}

/* Header */
#save-header{background:rgba(52,211,153,.07);border-bottom:1px solid rgba(52,211,153,.15);padding:24px 28px;text-align:center}
#save-icon{font-size:40px;margin-bottom:10px}
#save-headline{font-size:22px;font-weight:700;color:var(--green);margin-bottom:4px}
#save-subheadline{font-size:13px;color:#aaa;line-height:1.5}

/* Body */
#save-body{padding:24px 28px;display:flex;flex-direction:column;gap:16px}

/* What happened */
.save-section-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
#save-what-happened{font-size:13px;color:#ccc;line-height:1.7;padding:12px 14px;background:rgba(0,0,0,.25);border-radius:8px;border-left:3px solid var(--green)}

/* Timeline */
#save-timeline{display:flex;flex-direction:column;gap:0}
.save-tl-row{display:flex;gap:12px;position:relative}
.save-tl-row:not(:last-child)::after{content:'';position:absolute;left:11px;top:24px;width:2px;bottom:-8px;background:rgba(255,255,255,.06)}
.save-tl-dot{width:24px;height:24px;border-radius:50%;border:2px solid;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;margin-top:2px}
.save-tl-dot.warning{border-color:var(--yellow);background:rgba(251,191,36,.1);color:var(--yellow)}
.save-tl-dot.danger{border-color:var(--red);background:rgba(248,113,113,.1);color:var(--red)}
.save-tl-dot.saved{border-color:var(--green);background:rgba(52,211,153,.15);color:var(--green)}
.save-tl-dot.outcome{border-color:var(--accent);background:rgba(124,106,247,.15);color:var(--accent)}
.save-tl-body{padding-bottom:14px;flex:1}
.save-tl-time{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:2px}
.save-tl-event{font-size:12px;color:var(--text);font-weight:500;margin-bottom:2px}
.save-tl-detail{font-size:11px;color:#888;line-height:1.5}

/* What would have happened */
#save-counterfactual{padding:12px 14px;border-radius:8px;background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.2)}
.save-cf-title{font-size:12px;font-weight:600;color:var(--red);margin-bottom:6px}
.save-cf-text{font-size:12px;color:#bbb;line-height:1.6}
.save-cf-items{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.save-cf-item{font-size:11px;color:#aaa;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;gap:8px}
.save-cf-item:last-child{border-bottom:none}
.save-cf-item::before{content:'✗';color:var(--red);flex-shrink:0}

/* Metrics recovered */
#save-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.save-metric{background:rgba(0,0,0,.2);border-radius:6px;padding:10px 12px;text-align:center}
.save-metric-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.save-metric-before{font-family:var(--mono);font-size:12px;color:var(--red);text-decoration:line-through;margin-bottom:2px}
.save-metric-after{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--green)}
.save-metric-arrow{font-size:10px;color:var(--muted);margin:2px 0}

/* Footer */
#save-footer{padding:16px 28px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
#save-share-btn{font-size:12px;font-weight:600;padding:8px 16px;border-radius:6px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-family:var(--sans);transition:opacity .2s}
#save-share-btn:hover{opacity:.85}
#save-close-btn{font-size:12px;padding:8px 16px;border-radius:6px;background:transparent;color:var(--muted);border:1px solid var(--border);cursor:pointer;font-family:var(--sans)}
#save-timestamp{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto}
</style>

<!-- Save Moment Overlay -->
<div id="save-moment" onclick="if(event.target===this)closeSaveMoment()">
  <div id="save-box">
    <div id="save-header">
      <div id="save-icon">🛡️</div>
      <div id="save-headline">Your machine was just saved</div>
      <div id="save-subheadline">CVIS detected a failure before it happened and took action.</div>
    </div>
    <div id="save-body">
      <div>
        <div class="save-section-label">What happened</div>
        <div id="save-what-happened">Loading…</div>
      </div>
      <div>
        <div class="save-section-label">Timeline</div>
        <div id="save-timeline"></div>
      </div>
      <div id="save-counterfactual">
        <div class="save-cf-title">Without CVIS, this is what would have happened</div>
        <div class="save-cf-text" id="save-cf-text"></div>
        <div class="save-cf-items" id="save-cf-items"></div>
      </div>
      <div>
        <div class="save-section-label">Metrics — before and after</div>
        <div id="save-metrics"></div>
      </div>
    </div>
    <div id="save-footer">
      <button id="save-share-btn" onclick="shareSaveMoment()">Share this save</button>
      <button id="save-close-btn" onclick="closeSaveMoment()">Got it</button>
      <div id="save-timestamp"></div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  CVIS Save Moment
// ═══════════════════════════════════════════════════════

const SAVE_SHOWN_KEY = 'cvis_saves_shown';
let _saveMomentData = null;
let _lastResolvedPredId = null;
let _predMetricsAtWarning = {};
let _predStartTime = null;

// Track metrics when a prediction fires
function saveMomentTrackPrediction(pred) {
  if (!pred || pred.id === _lastResolvedPredId) return;
  if (!_predMetricsAtWarning[pred.id]) {
    _predMetricsAtWarning[pred.id] = {
      cpu:    snap.cpu_percent || 0,
      memory: snap.memory      || 0,
      disk:   snap.disk_percent|| 0,
      time:   Date.now(),
      type:   pred.type,
      message: pred.message,
      eta:    pred.eta_min,
      confidence: pred.confidence,
    };
    _predStartTime = Date.now();
  }
}

// Check if a prediction resolved positively (metrics recovered)
function saveMomentCheckResolution() {
  const pred = snap.active_prediction;

  // Prediction just disappeared — check if metrics recovered
  if (!pred && _predStartTime) {
    const elapsed = (Date.now() - _predStartTime) / 1000 / 60; // minutes
    // Find the tracked prediction
    const trackedIds = Object.keys(_predMetricsAtWarning);
    if (!trackedIds.length) return;

    const lastId = trackedIds[trackedIds.length - 1];
    if (lastId === _lastResolvedPredId) return;

    const tracked = _predMetricsAtWarning[lastId];
    if (!tracked) return;

    // Verify recovery — metrics should have improved
    const cpuNow  = snap.cpu_percent || 0;
    const memNow  = snap.memory      || 0;
    const recovered = (
      (tracked.type === 'OOM'      && memNow  < tracked.memory - 5) ||
      (tracked.type === 'CRASH'    && cpuNow  < tracked.cpu    - 8) ||
      (tracked.type === 'THERMAL'  && cpuNow  < tracked.cpu    - 5) ||
      (tracked.type === 'DISK_FULL'&& snap.disk_percent < tracked.disk - 5) ||
      elapsed < 5  // prediction resolved in under 5 min = action taken
    );

    if (recovered) {
      _lastResolvedPredId = lastId;
      _predStartTime = null;
      buildAndShowSaveMoment(lastId, tracked, {
        cpu:    cpuNow,
        memory: memNow,
        disk:   snap.disk_percent || 0,
      });
    } else {
      // Not recovered — prediction expired naturally, not a save
      _predStartTime = null;
    }
  }

  if (pred) saveMomentTrackPrediction(pred);
}

function buildAndShowSaveMoment(predId, before, after) {
  // Don't show same save twice
  const shown = JSON.parse(localStorage.getItem(SAVE_SHOWN_KEY) || '[]');
  if (shown.includes(predId)) return;
  shown.push(predId);
  if (shown.length > 50) shown.shift();
  localStorage.setItem(SAVE_SHOWN_KEY, JSON.stringify(shown));

  const type     = before.type;
  const minsBefore = Math.ceil(before.eta || 0);
  const now      = new Date();
  const warningTime = new Date(before.time);

  // What happened text
  const whatMap = {
    OOM:      `Memory was climbing steadily and reached ${before.memory.toFixed(0)}%. CVIS predicted an out-of-memory crash ${minsBefore} minutes in advance and flagged it for action. Memory has since recovered to ${after.memory.toFixed(0)}%.`,
    CRASH:    `CPU pressure reached ${before.cpu.toFixed(0)}% and a process crash was predicted ${minsBefore} minutes out. CVIS identified the cause and the issue has resolved — CPU is now at ${after.cpu.toFixed(0)}%.`,
    THERMAL:  `CPU temperature was rising unsustainably at ${before.cpu.toFixed(0)}%. CVIS predicted thermal throttling ${minsBefore} minutes ahead. The machine has cooled — CPU is now at ${after.cpu.toFixed(0)}%.`,
    DISK_FULL:`Storage activity hit ${before.disk.toFixed(0)}% and was heading toward saturation. CVIS caught it ${minsBefore} minutes before it became critical. Disk activity has returned to normal.`,
  };
  document.getElementById('save-what-happened').textContent =
    whatMap[type] || before.message || 'A failure was predicted and the system recovered before it occurred.';

  // Timeline
  const warningTimeStr = warningTime.toLocaleTimeString('en-US', {hour12: false, hour: '2-digit', minute: '2-digit'});
  const resolvedTimeStr = now.toLocaleTimeString('en-US', {hour12: false, hour: '2-digit', minute: '2-digit'});

  const timelineSteps = [
    {
      dot: 'warning', icon: '!',
      time: warningTimeStr,
      event: 'CVIS detected the warning signs',
      detail: _buildWarningDetail(type, before),
    },
    {
      dot: 'danger', icon: '⚠',
      time: `+${Math.round(minsBefore * 0.4)}min`,
      event: 'Failure prediction confirmed',
      detail: `${before.confidence || 85}% confidence. Estimated ${minsBefore} minutes to failure.`,
    },
    {
      dot: 'saved', icon: '✓',
      time: resolvedTimeStr,
      event: 'Threat neutralised',
      detail: 'Metrics recovered to safe levels. No data loss. No crash.',
    },
    {
      dot: 'outcome', icon: '★',
      time: 'Now',
      event: 'Machine is running normally',
      detail: `CPU ${after.cpu.toFixed(0)}% · Memory ${after.memory.toFixed(0)}% · All systems stable.`,
    },
  ];

  document.getElementById('save-timeline').innerHTML = timelineSteps.map(s => `
    <div class="save-tl-row">
      <div class="save-tl-dot ${s.dot}">${s.icon}</div>
      <div class="save-tl-body">
        <div class="save-tl-time">${s.time}</div>
        <div class="save-tl-event">${s.event}</div>
        <div class="save-tl-detail">${s.detail}</div>
      </div>
    </div>`).join('');

  // Counterfactual — what would have happened
  const cfMap = {
    OOM: {
      text: `Without intervention, your machine would have run out of memory in approximately ${minsBefore} minutes.`,
      items: [
        'All open applications would have crashed or frozen',
        'Any unsaved work would have been lost',
        'The machine would have required a forced restart',
        'Recovery time: 5-15 minutes of downtime',
      ],
    },
    CRASH: {
      text: `Without intervention, the overloaded process would have crashed in approximately ${minsBefore} minutes.`,
      items: [
        'The process would have terminated unexpectedly',
        'Dependent services could have cascaded into failure',
        'Any in-progress work would have been interrupted',
      ],
    },
    THERMAL: {
      text: `Without intervention, the CPU would have throttled itself in approximately ${minsBefore} minutes.`,
      items: [
        'Performance would have dropped by 40-60% automatically',
        'Heavy tasks like compiling or rendering would have stalled',
        'In severe cases, the machine may have shut down to protect hardware',
      ],
    },
    DISK_FULL: {
      text: `Without intervention, the disk would have reached capacity in approximately ${minsBefore} minutes.`,
      items: [
        'Write operations would have started failing silently',
        'Applications that rely on disk writes (databases, logs) would have crashed',
        'The OS itself could have become unstable',
      ],
    },
  };
  const cf = cfMap[type] || {
    text: `Without CVIS, this failure would have occurred in approximately ${minsBefore} minutes.`,
    items: ['System performance would have degraded', 'A manual restart may have been required'],
  };
  document.getElementById('save-cf-text').textContent = cf.text;
  document.getElementById('save-cf-items').innerHTML = cf.items.map(i =>
    `<div class="save-cf-item">${i}</div>`).join('');

  // Metrics before/after
  const metricSets = [
    { label: 'CPU',    before: before.cpu.toFixed(0)+'%',    after: after.cpu.toFixed(0)+'%'    },
    { label: 'Memory', before: before.memory.toFixed(0)+'%', after: after.memory.toFixed(0)+'%' },
    { label: 'Health', before: '—',                          after: (snap.health_credit_score||'—')+'' },
  ];
  document.getElementById('save-metrics').innerHTML = metricSets.map(m => `
    <div class="save-metric">
      <div class="save-metric-lbl">${m.label}</div>
      <div class="save-metric-before">${m.before}</div>
      <div class="save-metric-arrow">↓</div>
      <div class="save-metric-after">${m.after}</div>
    </div>`).join('');

  // Timestamp
  document.getElementById('save-timestamp').textContent =
    now.toLocaleDateString('en-US', {month:'short',day:'numeric'}) + ' · ' + resolvedTimeStr;

  // Store for sharing
  _saveMomentData = { type, before, after, cf, timelineSteps, timestamp: now.toISOString() };

  // Show
  document.getElementById('save-moment').classList.add('open');

  // Also update failures prevented counter
  if (dnaData) {
    dnaData.prevented = (dnaData.prevented || 0) + 1;
    const el = document.getElementById('sm-prevented');
    if (el) el.textContent = dnaData.prevented;
    const el2 = document.getElementById('hs-prevented');
    if (el2) el2.textContent = dnaData.prevented;
  }
}

function _buildWarningDetail(type, before) {
  const procs = snap.processes?.by_cpu || [];
  const top = procs[0];
  const topName = top?.name || 'unknown process';

  switch(type) {
    case 'OOM':
      return `Memory at ${before.memory.toFixed(0)}% and climbing. ${top ? topName + ' using ' + (top.mem||0).toFixed(0) + '% RAM.' : 'Multiple processes consuming high memory.'}`;
    case 'CRASH':
      return `CPU at ${before.cpu.toFixed(0)}%. ${top ? topName + ' at ' + (top.cpu||0).toFixed(0) + '% CPU — well above safe threshold.' : 'System under heavy load.'}`;
    case 'THERMAL':
      return `CPU sustained at ${before.cpu.toFixed(0)}% for several minutes — thermal pressure building.`;
    case 'DISK_FULL':
      return `Disk I/O at ${before.disk.toFixed(0)}%. Heavy read/write operations detected.`;
    default:
      return `Anomalous behaviour detected across multiple metrics.`;
  }
}

function closeSaveMoment() {
  document.getElementById('save-moment').classList.remove('open');
}

function shareSaveMoment() {
  if (!_saveMomentData) return;
  const d = _saveMomentData;
  const text = `CVIS just saved my machine from a ${d.type} crash.\n\n` +
    `Predicted ${Math.ceil(d.before.eta||0)} minutes before failure.\n` +
    `Memory: ${d.before.memory.toFixed(0)}% → ${d.after.memory.toFixed(0)}%\n` +
    `CPU: ${d.before.cpu.toFixed(0)}% → ${d.after.cpu.toFixed(0)}%\n\n` +
    `Without CVIS: ${d.cf.items[0]?.toLowerCase()}\n\n` +
    `#CVIS #AIOps #PreventiveMaintenance`;

  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('save-share-btn');
      btn.textContent = '✓ Copied to clipboard';
      setTimeout(() => { btn.textContent = 'Share this save'; }, 3000);
    });
  }
}

// Hook into the render loop to check for resolutions
const _origCheckPredExp = window.checkPredictionExpiry;
window.checkPredictionExpiry = function() {
  if (_origCheckPredExp) _origCheckPredExp();
  saveMomentCheckResolution();
};
</script>
