name: CVIS v9 CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # ── 1. Lint ───────────────────────────────────────────
  lint:
    name: Lint & type check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: system-ui/package-lock.json
      - run: pip install ruff mypy types-redis
      - run: >-
          ruff check --select E4,E7,E9,F
          --per-file-ignores "backend/main.py:E402"
          backend/main.py backend/core/auth/auth.py
          backend/core/storage/redis_store.py backend/core/logging/logging_config.py
          && ruff format --check backend/core/auth/auth.py
          backend/core/storage/redis_store.py backend/core/logging/logging_config.py
      - run: >-
          mypy backend/main.py backend/core/auth/auth.py
          backend/core/storage/redis_store.py backend/core/logging/logging_config.py
          --ignore-missing-imports --no-strict-optional --follow-imports=silent
      - name: Lint, build, and verify frontend assets
        run: |
          npm ci --prefix system-ui
          npm run lint --prefix system-ui
          npm run build --prefix system-ui

  # ── 2. Tests ──────────────────────────────────────────
  test:
    name: Test suite
    runs-on: ubuntu-22.04
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && pip install pytest pytest-asyncio pytest-cov httpx
      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379/0
          CVIS_API_KEY: ci-bootstrap-key
          JWT_SECRET: ci-test-secret-key-32-bytes-minimum
          CVIS_ADMIN_PASS: ci-test-pass
        run: pytest tests/ judgment/ -v --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=10 -x

  # ── 3. Full-stack browser smoke test ──────────────────
  ui-e2e:
    name: Authenticated UI smoke test
    runs-on: ubuntu-22.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: system-ui/package-lock.json
      - run: npm ci --prefix system-ui
      - run: npx --prefix system-ui playwright install --with-deps chromium
      - name: Configure isolated test credentials
        run: |
          cat > .env <<'EOF'
          ENV=dev
          JWT_SECRET=ci-only-secret-key-with-at-least-32-characters
          CVIS_API_KEY=ci-only-api-key
          CVIS_ADMIN_USER=ci-admin
          CVIS_ADMIN_PASS=ci-only-password
          GRAFANA_PASS=ci-only-grafana-password
          CVIS_HTTP_PORT=80
          EOF
      - name: Start backend, Redis, and frontend
        run: docker compose up --build --detach --wait backend frontend
      - name: Verify login, telemetry, and alert history in Chromium
        env:
          BASE_URL: http://127.0.0.1
          CVIS_ADMIN_USER: ci-admin
          CVIS_ADMIN_PASS: ci-only-password
        run: npm run test:e2e --prefix system-ui
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 backend frontend redis
      - name: Stop test stack
        if: always()
        run: docker compose down --remove-orphans

  # ── 4. Build & push image ─────────────────────────────
  build:
    name: Build & push image
    runs-on: ubuntu-22.04
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags:   ${{ steps.meta.outputs.tags }}
      image:  ${{ steps.image-name.outputs.image }}
      frontend_image: ${{ steps.frontend-image-name.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image-name
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/cvis-backend" >> "$GITHUB_OUTPUT"
      - id: frontend-image-name
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/cvis-frontend" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image-name.outputs.image }}
          tags: |
            type=ref,event=branch,suffix=-${{ github.sha }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
      - id: frontend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.frontend-image-name.outputs.image }}
          tags: |
            type=ref,event=branch,suffix=-${{ github.sha }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable={{is_default_branch}}
      - id: frontend-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: nginx/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - run: echo "Digest ${{ steps.build.outputs.digest }}"

  # ── 5. Security scan ──────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-22.04
    needs: build
    if: ${{ needs.build.result == 'success' }}
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        id: checkout
      - uses: docker/login-action@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
        if: ${{ github.event_name == 'pull_request' }}
      - uses: docker/build-push-action@v7
        if: ${{ github.event_name == 'pull_request' }}
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          tags: cvis-backend:pr-scan
      - name: Diagnose Trivy findings
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ github.event_name == 'pull_request' && 'cvis-backend:pr-scan' || format('{0}@{1}', needs.build.outputs.image, needs.build.outputs.digest) }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ github.event_name == 'pull_request' && 'cvis-backend:pr-scan' || format('{0}@{1}', needs.build.outputs.image, needs.build.outputs.digest) }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-files: /usr/local/lib/python3.12/site-packages/pip/_vendor/bom.cdx.json
          exit-code: "1"
      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif
          path: trivy.sarif
          if-no-files-found: warn
      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        if: ${{ always() && hashFiles('trivy.sarif') != '' }}
        with:
          sarif_file: trivy.sarif
      - uses: actions/setup-python@v7
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r requirements.txt --strict --vulnerability-service osv
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}

  # ── 6. Deploy staging ─────────────────────────────────
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-22.04
    needs: [build, security]
    if: >-
      ${{
        github.ref == 'refs/heads/develop' &&
        github.event_name == 'push' &&
        vars.ENABLE_STAGING_DEPLOY == 'true'
      }}
    environment:
      name: staging
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/cvis
            test -f .env || { echo "Missing staging .env" >&2; exit 1; }
            for name in ENV JWT_SECRET CVIS_API_KEY CVIS_ADMIN_PASS GRAFANA_PASS DOMAIN CVIS_DATABASE_URL PUBLIC_BASE_URL SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_FROM CVIS_HTTP_PORT; do
              if ! grep -Eq "^${name}=.+$" .env; then
                echo "Missing required staging .env setting: ${name}" >&2
                exit 1
              fi
            done
            grep -qx 'ENV=production' .env || { echo "Staging ENV must be production" >&2; exit 1; }
            grep -qx 'CVIS_HTTP_PORT=80' .env || { echo "Staging CVIS_HTTP_PORT must be 80" >&2; exit 1; }
            if grep -Eiq '^DOMAIN=(localhost|127\.0\.0\.1)(:[0-9]+)?/?$' .env; then
              echo "Staging DOMAIN must be a public hostname" >&2
              exit 1
            fi
            grep -Eq '^PUBLIC_BASE_URL=https://[^[:space:]#]+$' .env || { echo "Staging PUBLIC_BASE_URL must use HTTPS" >&2; exit 1; }
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            IMAGE="${{ needs.build.outputs.image }}:develop-${{ github.sha }}"
            FRONTEND_IMAGE="${{ needs.build.outputs.frontend_image }}:develop-${{ github.sha }}"
            IMAGE="$IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" python3 - <<'PY'
            import os
            import re
            from pathlib import Path

            path = Path("docker-compose.yml")
            text = path.read_text()

            for service, image in (
              ("backend", os.environ["IMAGE"]),
              ("frontend", os.environ["FRONTEND_IMAGE"]),
            ):
              pattern = (
                rf"(?ms)(^  {re.escape(service)}:\n)"
                rf"(.*?)(?=^  [A-Za-z0-9_-]+:\n|\Z)"
              )
              match = re.search(pattern, text)
              if not match:
                raise SystemExit(f"Compose service not found: {service}")

              block = match.group(2)
              updated, count = re.subn(
                r"(?m)^([ \t]+image:[ \t]*).+$",
                lambda m: m.group(1) + image,
                block,
                count=1,
              )
              if count != 1:
                raise SystemExit(f"Expected one image entry for {service}")

              text = text[:match.start(2)] + updated + text[match.end(2):]

            path.write_text(text)
            PY
            docker compose -f docker-compose.yml pull backend frontend
            docker compose -f docker-compose.yml up -d --no-deps --wait backend frontend
            curl -sf http://localhost:8020/health | grep '"status"'
            HTML="$(curl -sf http://localhost/)"
            ASSETS="$(printf '%s' "$HTML" | grep -oE '/assets/[^"]+\.(js|css)' | sort -u)"
            test -n "$ASSETS"
            for ASSET in $ASSETS; do
              curl -sf "http://localhost${ASSET}" -o /dev/null
            done
            echo "Staging backend and frontend smoke checks passed"
      - uses: slackapi/slack-github-action@v1.26
        if: ${{ always() && vars.ENABLE_SLACK_NOTIFICATIONS == 'true' }}
        with:
          payload: '{"text":"${{ job.status == ''success'' && ''✅'' || ''❌'' }} Staging: *${{ github.ref_name }}* @ `${{ github.sha }}` — ${{ job.status }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
